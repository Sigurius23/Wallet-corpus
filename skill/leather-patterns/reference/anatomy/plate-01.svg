<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 890" width="1120" height="890" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .lbl { font-size: 12px; fill: #f7f2ea; font-weight: 600; letter-spacing: .2px; }
      .lbl-s { font-size: 10.5px; fill: #f2ece1; }
      .lbl-d { font-size: 10.5px; fill: #2b2622; }
      .cap { font-size: 12.5px; fill: #2b2622; font-weight: 700; }
      .note { font-size: 10.5px; fill: #5a5148; }
      .cut { fill: none; stroke: #b3402f; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .outline { fill: #ece5da; stroke: #4a4038; stroke-width: 2.5; }
    </style>
    <pattern id="h1" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#6f665a"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#4f483f" stroke-width="2.5"/>
    </pattern>
    <clipPath id="bov"><path d="M270,55 C350,60 410,125 425,205 C440,285 425,385 380,445 C340,495 300,520 270,520 C240,520 200,495 160,445 C115,385 100,285 115,205 C130,125 190,60 270,55 Z"/></clipPath>
    <clipPath id="eq"><path d="M800,55 C870,60 915,115 928,190 C941,265 928,360 888,420 C852,470 825,495 800,495 C775,495 748,470 712,420 C672,360 659,265 672,190 C685,115 730,60 800,55 Z"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1120" height="890" fill="#fbf8f3"/>
  <text x="30" y="32" class="cap" font-size="17">Hide anatomy — where the material changes</text>
  <text x="30" y="50" class="note">Schematic. Outlines are idealised and not to scale; the boundaries are anatomical. Red dashed lines are the trade's cut lines.</text>

  <!-- ================= BOVINE ================= -->
  <g>
    <path d="M270,55 C350,60 410,125 425,205 C440,285 425,385 380,445 C340,495 300,520 270,520 C240,520 200,495 160,445 C115,385 100,285 115,205 C130,125 190,60 270,55 Z" class="outline"/>

    <g clip-path="url(#bov)">
      <rect x="80" y="45" width="390" height="90" fill="#6b6357"/>
      <rect x="80" y="135" width="390" height="80" fill="#9a7355"/>
      <rect x="80" y="215" width="390" height="180" fill="#c9bca8"/>
      <rect x="165" y="215" width="210" height="180" fill="#8d6b4f"/>
      <rect x="80" y="395" width="390" height="80" fill="#7a4b3a"/>
      <rect x="80" y="475" width="390" height="50" fill="#5c4636"/>
    </g>

    <text x="270" y="92" class="lbl" text-anchor="middle">HEAD · CHEEK · FACE</text>
    <text x="270" y="107" class="lbl-s" text-anchor="middle">offal — thin, small, marked</text>

    <text x="270" y="160" class="lbl" text-anchor="middle">NECK · SHOULDER</text>
    <text x="270" y="176" class="lbl-s" text-anchor="middle">neck most mobile, most wrinkle</text>
    <text x="270" y="191" class="lbl-s" text-anchor="middle">shoulder thick, firm · fore shanks at corners</text>

    <text x="132" y="292" class="lbl-d" text-anchor="middle" transform="rotate(-90 132 292)">BELLY · MIDDLE</text>
    <text x="408" y="292" class="lbl-d" text-anchor="middle" transform="rotate(90 408 292)">BELLY · MIDDLE</text>

    <text x="270" y="285" class="lbl" text-anchor="middle">BEND</text>
    <text x="270" y="302" class="lbl-s" text-anchor="middle">densest · most uniform</text>
    <text x="270" y="317" class="lbl-s" text-anchor="middle">lowest stretch</text>

    <text x="270" y="428" class="lbl" text-anchor="middle">BUTT</text>
    <text x="270" y="445" class="lbl-s" text-anchor="middle">thickest · hind shanks at corners</text>

    <text x="270" y="505" class="lbl-s" text-anchor="middle">TAIL END</text>

    <line x1="270" y1="45" x2="270" y2="530" class="cut"/>
    <line x1="80" y1="135" x2="460" y2="135" class="cut"/>
    <line x1="80" y1="215" x2="460" y2="215" class="cut"/>
    <line x1="80" y1="395" x2="460" y2="395" class="cut"/>

    <text x="270" y="552" class="cap" text-anchor="middle">BOVINE — body regions (L1) and the cuts (L2)</text>
    <text x="270" y="572" class="note" text-anchor="middle">backbone cut ⟶ two SIDES · belly line separates firm from loose</text>
    <text x="270" y="588" class="note" text-anchor="middle">shoulder off at the break ⟶ DOUBLE SHOULDER · shoulder off a back ⟶ BEND</text>
    <text x="270" y="604" class="note" text-anchor="middle">bellies + shoulder off ⟶ BUTT · untanned butt/bend ⟶ CROUPON</text>
    <text x="270" y="622" class="note" text-anchor="middle" fill="#b3402f" font-weight="700">CULATTA (bovine) = butt + belly middles + hind shanks — a mixed cut</text>
  </g>

  <!-- ================= EQUINE ================= -->
  <g>
    <path d="M800,55 C870,60 915,115 928,190 C941,265 928,360 888,420 C852,470 825,495 800,495 C775,495 748,470 712,420 C672,360 659,265 672,190 C685,115 730,60 800,55 Z" class="outline"/>

    <g clip-path="url(#eq)">
      <rect x="650" y="45" width="300" height="170" fill="#3f6f7a"/>
      <rect x="650" y="215" width="300" height="105" fill="url(#h1)"/>
      <rect x="650" y="320" width="300" height="185" fill="#8d6b4f"/>
    </g>

    <text x="800" y="115" class="lbl" text-anchor="middle">FRONT — FQHH / DHF</text>
    <text x="800" y="132" class="lbl-s" text-anchor="middle">1.0–1.2 mm · ~2/3 of hide area</text>
    <text x="800" y="148" class="lbl-s" text-anchor="middle">thin, coarse grain, flexible</text>

    <text x="800" y="248" class="lbl" text-anchor="middle">STRIP — a.k.a. "horsebutt"</text>
    <text x="800" y="265" class="lbl-s" text-anchor="middle">1.6–4 mm · very coarse grain</text>

    <ellipse cx="760" cy="405" rx="48" ry="56" fill="#e8d9b8" stroke="#8a6d3b" stroke-width="2.5"/>
    <ellipse cx="848" cy="405" rx="48" ry="56" fill="#e8d9b8" stroke="#8a6d3b" stroke-width="2.5"/>
    <text x="760" y="399" class="lbl-d" text-anchor="middle" font-weight="700">SHELL</text>
    <text x="760" y="413" class="lbl-d" text-anchor="middle">~1–2.5 ft²</text>
    <text x="848" y="399" class="lbl-d" text-anchor="middle" font-weight="700">SHELL</text>
    <text x="848" y="413" class="lbl-d" text-anchor="middle">~1–2.5 ft²</text>

    <line x1="650" y1="215" x2="950" y2="215" class="cut" stroke-width="2.5"/>
    <text x="918" y="200" class="note" fill="#b3402f" font-weight="700" text-anchor="end">460 mm cut</text>

    <text x="800" y="552" class="cap" text-anchor="middle">EQUINE — front / butt, and the layer inside the butt</text>
    <text x="800" y="572" class="note" text-anchor="middle">cut 460 mm (18 in) forward of the tail root, at right angles to the backbone</text>
    <text x="800" y="588" class="note" text-anchor="middle">"horse butt" is a misnomer — the strip sits in front of the butt</text>
    <text x="800" y="604" class="note" text-anchor="middle">hyaline layer: equine rump only · no grain · rolls, never creases</text>
    <text x="800" y="622" class="note" text-anchor="middle" fill="#b3402f" font-weight="700">CULATTA (equine) = butt leather with shell traces on the flesh side</text>
  </g>

  <!-- ================= CROSS SECTIONS ================= -->
  <line x1="30" y1="650" x2="1090" y2="650" stroke="#d8cfc2" stroke-width="1.5"/>
  <text x="30" y="672" class="cap" font-size="14">Through the thickness (L3) — the axis the trade names least often</text>

  <g>
    <text x="30" y="694" class="note" font-weight="700">bovine, generic</text>
    <rect x="30" y="702" width="300" height="11" fill="#e6dcc8" stroke="#4a4038" stroke-width="1"/>
    <rect x="30" y="713" width="300" height="30" fill="#8d6b4f" stroke="#4a4038" stroke-width="1"/>
    <rect x="30" y="743" width="300" height="4" fill="#b3402f"/>
    <rect x="30" y="747" width="300" height="52" fill="#6b5f50" stroke="#4a4038" stroke-width="1"/>
    <rect x="30" y="799" width="300" height="18" fill="#a89880" stroke="#4a4038" stroke-width="1"/>

    <text x="342" y="711" class="note">epidermis 0.1–0.2 mm — removed</text>
    <text x="342" y="729" class="note" font-weight="700">GRAIN (papillary)</text>
    <text x="342" y="743" class="note">carries the pore pattern</text>
    <text x="342" y="760" class="note" fill="#b3402f" font-weight="700">grain–corium junction</text>
    <text x="342" y="776" class="note">where a finish lifts</text>
    <text x="342" y="793" class="note">CORIUM (reticular) 80–90 %</text>
    <text x="342" y="812" class="note">flesh split — carries the</text>
    <text x="342" y="826" class="note">thickness variation</text>
  </g>

  <g>
    <text x="620" y="694" class="note" font-weight="700">equine, rump only</text>
    <rect x="620" y="702" width="260" height="11" fill="#e6dcc8" stroke="#4a4038" stroke-width="1"/>
    <rect x="620" y="713" width="260" height="22" fill="#e8d9b8" stroke="#4a4038" stroke-width="1"/>
    <rect x="620" y="735" width="260" height="20" fill="#8d6b4f" stroke="#4a4038" stroke-width="1"/>
    <rect x="620" y="755" width="260" height="4" fill="#b3402f"/>
    <rect x="620" y="759" width="260" height="40" fill="#6b5f50" stroke="#4a4038" stroke-width="1"/>
    <rect x="620" y="799" width="260" height="18" fill="#a89880" stroke="#4a4038" stroke-width="1"/>

    <text x="892" y="712" class="note">epidermis</text>
    <text x="892" y="729" class="note" font-weight="700" fill="#8a6d3b">HYALINE / SHELL</text>
    <text x="892" y="744" class="note" fill="#8a6d3b">no grain · ~10× denser</text>
    <text x="892" y="761" class="note">grain–corium junction</text>
    <text x="892" y="783" class="note">CORIUM</text>
    <text x="892" y="812" class="note">flesh split</text>
    <text x="892" y="826" class="note">(carries shell traces</text>
    <text x="892" y="840" class="note">in a culatta)</text>
  </g>

  <text x="30" y="862" class="note" font-style="italic">A properly split and shaved leather can be near-uniform in millimetres while remaining very non-uniform in weave and stretch. Buy the</text>
  <text x="30" y="876" class="note" font-style="italic">thickness; respect the structure. Full grain is a statement about the layer (L3), not about which part of the animal you got (L1).</text>
</svg>
